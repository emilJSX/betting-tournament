services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tournament
      POSTGRES_PASSWORD: tournament
      POSTGRES_DB: tournament
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: tournament
      RABBITMQ_DEFAULT_PASS: tournament
    ports:
      - '5672:5672'
      - '15672:15672'

volumes:
  postgres-data:
